name: Build Android APK

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.5'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26c
          emulator: false

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            android/app/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'android/app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          npm ci
          cd android && npm ci 2>/dev/null || true

      - name: Build web assets
        run: npm run build
        env:
          VITE_SIGNALING_URL: ${{ secrets.VITE_SIGNALING_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        if: github.event.inputs.build_type != 'release' || github.event_name != 'workflow_dispatch'
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        if: github.event.inputs.build_type == 'release' && github.event_name == 'workflow_dispatch'
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ secrets.SIGNING_STORE_FILE }}

      - name: Upload Debug APK
        if: github.event.inputs.build_type != 'release' || github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dom-remote-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        if: github.event.inputs.build_type == 'release' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dom-remote-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-server:
    name: Build Signaling Server
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install server dependencies
        run: |
          cd server
          npm ci

      - name: Run server tests
        run: |
          cd server
          npm test 2>/dev/null || echo "No tests defined"

      - name: Build server Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          tags: dom-os-signaling:latest
          load: true

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: dom-os-signaling-server
          path: server/
          retention-days: 30

  notify:
    name: Notify Build Complete
    needs: [build-android, build-server]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build status
        run: |
          echo "Android build: ${{ needs.build-android.result }}"
          echo "Server build: ${{ needs.build-server.result }}"
          if [ "${{ needs.build-android.result }}" == "success" ]; then
            echo "✅ Android APK built successfully"
          else
            echo "❌ Android build failed"
          fi
          if [ "${{ needs.build-server.result }}" == "success" ]; then
            echo "✅ Server built successfully"
          else
            echo "❌ Server build failed"
          fi